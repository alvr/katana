query MediaListCollection($user: Int, $type: MediaType!) {
    MediaListCollection(userId: $user, type: $type) {
        lists {
            name
            entries {
                ...mediaListEntry
            }
        }
        user {
            mediaListOptions {
                animeList {
                    sectionOrder
                }
                mangaList {
                    sectionOrder
                }
            }
        }
    }
}
