name: Katana

on:
  pull_request:
  push:
    branches:
      - develop
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

permissions:
  contents: read

jobs:
  cancel-stale-jobs:
    name: Cancel stale jobs
    runs-on: ubuntu-slim
    permissions:
      actions: write
    steps:
      - name: Cancel Stale Jobs
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validation:
    name: Validation
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

  assemble:
    name: Assemble
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        name: [Android, iOS]
        include:
          - name: Android
            platform: android
            runner: ubuntu-latest
          - name: iOS
            platform: ios
            runner: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Common Steps
        uses: ./.github/actions/common-steps
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build Katana Debug
        run: bundle exec fastlane ${{ matrix.platform }} build_debug
      - name: Sanitize compose report filenames
        if: always() && matrix.platform == 'android'
        run: |
          find . -type f \( -path '*/build/compose-metrics/*' -o -path '*/build/compose-reports/*' \) -name '*:*' | while read -r f; do
            mv "$f" "$(dirname "$f")/$(basename "$f" | tr ':' '_')"
          done
      - name: Upload compose reports artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.platform == 'android'
        with:
          name: compose-reports
          path: |
            **/build/compose-metrics
            **/build/compose-reports
          retention-days: 7

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Common Steps
        uses: ./.github/actions/common-steps
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run detekt
        run: ./gradlew detektAll lintDebug --no-daemon --stacktrace
      - name: Upload static reports artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-report
          path: |
            build/reports/detekt/detekt.xml
            **/build/reports/lint-results-debug.xml
          retention-days: 1
      - name: Analyze detekt report
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: build/reports/detekt/all.sarif
          checkout_path: ${{ github.workspace }}

  unit-tests:
    name: Unit testing
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        name: [Android, iOS]
        include:
          - name: Android
            platform: android
            runner: ubuntu-latest
          - name: iOS
            platform: ios
            runner: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Common Steps
        uses: ./.github/actions/common-steps
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run Android unit tests
        if: matrix.platform == 'android'
        run: ./gradlew androidTests :koverXmlReport :koverVerify --no-daemon --stacktrace
      - name: Run iOS unit tests
        if: matrix.platform == 'ios'
        run: ./gradlew iosTests --no-daemon --stacktrace
      - name: Upload tests reports artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform }}-tests-reports
          path: |
            **/build/reports/${{ matrix.platform }}-tests
          retention-days: 7
      - name: Upload report to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.platform == 'android'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          flags: unittests
          verbose: true

  deploy-beta:
    name: Beta deployment
    runs-on: ${{ matrix.runner }}
    if: github.ref == 'refs/heads/develop'
    needs: [static-analysis, unit-tests]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        name: [Android]
        include:
          - name: Android
            platform: android
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Common Steps
        uses: ./.github/actions/common-steps
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Decode keystore
        if: matrix.platform == 'android'
        run: echo -n "$SIGNING_FILE_BASE64" | base64 --decode > "$SIGNING_FILE"
        env:
          SIGNING_FILE: ${{ secrets.SIGNING_FILE }}
          SIGNING_FILE_BASE64: ${{ secrets.SIGNING_FILE_BASE64 }}
      - name: Bump versionCode
        if: matrix.platform == 'android'
        run: |
          perl -pi -e 's/(const val VersionCode = )\d+/${1}$ENV{GITHUB_RUN_NUMBER}/' \
            build-logic/katana-convention/src/main/kotlin/dev/alvr/katana/buildlogic/KatanaConfiguration.kt
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - name: Build and Deploy Katana Beta
        run: bundle exec fastlane ${{ matrix.platform }} build_deploy_beta
        env:
          AC_PERSONAL_API_TOKEN: ${{ secrets.AC_PERSONAL_API_TOKEN }}
          AC_PROFILE_NAME: ${{ vars.AC_PROFILE_NAME }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
          SIGNING_ALIAS_PASS: ${{ secrets.SIGNING_ALIAS_PASS }}
          SIGNING_FILE: ${{ secrets.SIGNING_FILE }}
          SIGNING_FILE_PASS: ${{ secrets.SIGNING_FILE_PASS }}
      - name: Sanitize compose report filenames
        if: always() && matrix.platform == 'android'
        run: |
          find . -type f \( -path '*/build/compose-metrics/*' -o -path '*/build/compose-reports/*' \) -name '*:*' | while read -r f; do
            mv "$f" "$(dirname "$f")/$(basename "$f" | tr ':' '_')"
          done
      - name: Upload compose reports artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.platform == 'android'
        with:
          name: compose-reports
          path: |
            **/build/compose-metrics
            **/build/compose-reports
          retention-days: 7

  deploy-production:
    name: Production deployment
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [static-analysis, unit-tests]
    strategy:
      fail-fast: false
      matrix:
        name: [Android]
        include:
          - name: Android
            platform: android
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Common Steps
        uses: ./.github/actions/common-steps
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Decode keystore
        if: matrix.platform == 'android'
        run: echo -n "$SIGNING_FILE_BASE64" | base64 --decode > "$SIGNING_FILE"
        env:
          SIGNING_FILE: ${{ secrets.SIGNING_FILE }}
          SIGNING_FILE_BASE64: ${{ secrets.SIGNING_FILE_BASE64 }}
      - name: Build and Deploy Katana Release
        run: bundle exec fastlane ${{ matrix.platform }} build_deploy_release
        env:
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
          SIGNING_ALIAS_PASS: ${{ secrets.SIGNING_ALIAS_PASS }}
          SIGNING_FILE: ${{ secrets.SIGNING_FILE }}
          SIGNING_FILE_PASS: ${{ secrets.SIGNING_FILE_PASS }}
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
