[versions]
android = "9.3.1"
androidx-activity = "1.13.0"
androidx-benchmark = "1.5.0-beta01"
androidx-splashscreen = "1.2.0"
androidx-test-ext-junit = "1.3.0"
apollo = "5.0.1"
apollo-cache = "1.0.6"
apollo-mockserver = "0.3.1"
arrow = "2.2.3"
baselineprofile = "1.5.0-beta01"
coil = "3.5.0"
compose = "1.12.0-beta03"
compose-placeholder = "1.0.12"
compose-stability-analyzer = "0.12.0"
desugaring = "2.1.5"
detekt = "2.0.0-alpha.6"
detekt-compose = "0.6.4"
detekt-compose2 = "1.4.0"
kermit = "2.1.0"
kaml = "0.104.0"
kotest = "6.2.3"
kotlin = "2.4.10"
kotlinpoet = "2.3.0"
kotlinx-atomicfu = "0.33.0"
kotlinx-coroutines = "1.11.0"
